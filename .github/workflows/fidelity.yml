# Render fidelity (docs/brand-system/PHASE-0.md, Step 6): every fixture in
# test/fidelity/fixtures rendered through the real export path in Chromium,
# Firefox and WebKit and compared with its golden. Fails when a fixture gets
# worse than its approved baseline, errors, or changes size. Kept out of
# `npm run verify` so verify stays fast; see docs/CI.md.
name: Fidelity

on:
  pull_request:
    paths:
      - src/app/components/SchemaRenderer.tsx
      - src/lib/render/**
      - src/lib/types.ts
      - src/lib/figma/**
      - src/lib/templates/**
      - supabase/functions/_shared/extract.ts
      - supabase/functions/_shared/figmaLayers.ts
      - scripts/fidelity/**
      - test/fidelity/**
      - .github/workflows/fidelity.yml

concurrency:
  group: fidelity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fidelity:
    name: fidelity
    # The baselines were recorded on macOS. Text rasterizes differently on
    # Linux, so a Linux runner would report glyph edges as regressions.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - name: Install (frozen lockfile)
        run: npm ci

      - name: Browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      # Starter fixtures load Google Fonts, so the run needs network access.
      - name: Render and compare
        run: node scripts/fidelity/fidelity.mjs run

      - name: Upload renders, heatmaps and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fidelity-out
          path: test/fidelity/out/
          if-no-files-found: ignore
