# Render fidelity (docs/brand-system/PHASE-0.md, Step 6): every fixture in
# test/fidelity/fixtures rendered through the real export path in Chromium,
# Firefox and WebKit and compared with its golden. Fails when a fixture gets
# worse than its approved baseline, errors, or changes size. Kept out of
# `npm run verify` so verify stays fast; see docs/CI.md.
name: Fidelity

on:
  pull_request:
    paths:
      - src/app/components/SchemaRenderer.tsx
      - src/lib/render/**
      - src/lib/types.ts
      - src/lib/figma/**
      - src/lib/templates/**
      - supabase/functions/_shared/extract.ts
      - supabase/functions/_shared/figmaLayers.ts
      - scripts/fidelity/**
      - test/fidelity/**
      - .github/workflows/fidelity.yml

concurrency:
  group: fidelity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fidelity:
    name: fidelity
    # The baselines were recorded on macOS. Text rasterizes differently on
    # Linux, so a Linux runner would report glyph edges as regressions.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - name: Install (frozen lockfile)
        run: npm ci

      - name: Browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      # Google's fonts come from the recording in test/fidelity/google-fonts,
      # so the run asks Google for nothing.
      - name: Render and compare
        run: node scripts/fidelity/fidelity.mjs run

      # An older WebKit that draws as Safari before 26 does
      # (scripts/fidelity/webkit18.mjs). No fixture has a baseline for it,
      # so the two steps below report and fail nothing. They come after the
      # gate, each has a limit of its own inside the job's, and a failure
      # in either shows as a warning on the run.
      - name: WebKit 18.5
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          node scripts/fidelity/webkit18.mjs install || {
            echo "::warning title=WebKit 18.5::The install failed, so the webkit18 report has nothing to render in."
            exit 1
          }

      # The harness fails a row with no baseline under CI, which is why CI
      # is emptied here. Every run writes report.json, so the gate's is set
      # aside and put back, and this run's is kept as report-webkit18.json.
      - name: Render and compare in WebKit 18.5 (reports only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          CI: ""
        run: |
          out=test/fidelity/out
          if [ -f "$out/report.json" ]; then mv "$out/report.json" "$out/report-gate.json"; fi
          status=0
          node scripts/fidelity/fidelity.mjs run --engines webkit18 || status=$?
          if [ -f "$out/report.json" ]; then mv "$out/report.json" "$out/report-webkit18.json"; fi
          if [ -f "$out/report-gate.json" ]; then mv "$out/report-gate.json" "$out/report.json"; fi
          if [ "$status" -ne 0 ]; then
            echo "::warning title=WebKit 18.5::The webkit18 run exited $status. It reports only. Read this step's log."
          fi
          exit "$status"

      - name: Upload renders, heatmaps and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fidelity-out
          path: test/fidelity/out/
          if-no-files-found: ignore
