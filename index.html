<!doctype html>
<html lang="en" data-theme="dark" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale: it blocked pinch-zoom (WCAG 1.4.4). iOS Safari
         zooms when a focused field's text is under 16, so text fields take
         16 on a coarse pointer (the touch rule at the end of primitives.css). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- The icon: the lockup's gradient mark with its grain, on its own (CJ,
         2026-11-16, in place of the Slime tile). It is cut from
         logo-on-light.svg beside it: the same lines with the wordmark's
         paths taken out and the box cropped to the mark, 35.2727 square.
         Vite hashes and emits it like any other asset. -->
    <link rel="icon" type="image/svg+xml" href="/src/assets/socialpaint/favicon.svg" />

    <title>Brand Template Portal</title>
    <meta
      name="description"
      content="Streamlines marketing content creation by ensuring consistent formatting, alignment, and responsive text sizing for clear, professional presentations."
    />

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      #root {
        height: 100%;
      }
    </style>

    <!-- Design-system tokens are scoped to [data-theme], so the attribute has
           to be right before first paint — ColorSchemeProvider only runs after
           React mounts, which would flash the wrong theme. -->
    <script>
      (function () {
        try {
          var v = localStorage.getItem("sp-color-scheme");
          var dark =
            v === "dark" ||
            ((v === "system" || !v) && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var el = document.documentElement;
          el.setAttribute("data-theme", dark ? "dark" : "light");
          el.classList.toggle("dark", dark);
          el.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
